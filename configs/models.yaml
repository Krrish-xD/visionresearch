# Model Configurations and Prompts
# Optimized for 16 GB VRAM GPU Budget (NVIDIA RTX 2000 Ada / 16 GB)

models:
  internvl3-8b:
    hf_id: "weights/internvl3-8b"
    family: "internvl"
    torch_dtype: "bfloat16"
    load_in_4bit: true
    trust_remote_code: true
    attn_implementation: "sdpa"
    max_new_tokens: 4
    temperature: 0.0

  llava-1.5-7b:
    hf_id: "llava-hf/llava-1.5-7b-hf"
    family: "llava"
    torch_dtype: "float16"
    load_in_4bit: true
    trust_remote_code: false
    attn_implementation: "sdpa"
    max_new_tokens: 4
    temperature: 0.0

  qwen2.5-vl-7b:
    hf_id: "weights/qwen2.5-vl-7b"
    family: "qwen"
    torch_dtype: "bfloat16"
    load_in_4bit: true
    trust_remote_code: true
    attn_implementation: "sdpa"
    max_new_tokens: 4
    temperature: 0.0

prompts:
  count:
    instruction: "Answer with only one integer.\nQuestion: {question}"
  yes_no:
    instruction: "Answer with only yes or no.\nQuestion: {question}"
  attribute:
    instruction: "Answer with only the single attribute word.\nQuestion: {question}"
  choice:
    instruction: "Options: {options}\nAnswer with only the letter of the correct option, for example (a) or (b).\nQuestion: {question}"
  relation:
    instruction: "Question: {question}\nAnswer with only the relation word (e.g., left, right, above, below, front, behind)."
